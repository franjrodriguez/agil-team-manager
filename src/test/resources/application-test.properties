# ?????????????????????????????????????????????
# Configuración exclusiva para tests de integración
# Usa H2 en memoria ? no toca PostgreSQL
# ?????????????????????????????????????????????

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas automáticamente desde las entidades
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Desactivar Security para tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Logs mínimos
logging.level.root=WARN
logging.level.com.iesaguadulce=INFO