<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Vídeo Demostración — AgilTeam Manager</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      color: #2c2c2c;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 50px 60px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 520px;
    }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { font-size: 22px; color: #1E3A5F; margin-bottom: 10px; }
    p { color: #666; font-size: 15px; line-height: 1.6; }
    .badge {
      display: inline-block;
      margin-top: 24px;
      background: #1E3A5F;
      color: #fff;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 13px;
    }
    .repo {
      margin-top: 16px;
      font-size: 13px;
      color: #2E75B6;
    }
    .repo a { color: #2E75B6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎬</div>
    <h1>Vídeo Demostración</h1>
    <p>
      El vídeo de demostración de <strong>AgilTeam Manager</strong> estará
      disponible próximamente en el repositorio del proyecto.
    </p>
    <div class="badge">⏳ En breve disponible</div>
    <div class="repo">
      Repositorio:
      <a href="https://github.com/franjrodriguez/agil-team-manager" target="_blank">
        github.com/franjrodriguez/agil-team-manager
      </a>
    </div>
  </div>
</body>
</html>
